name: Detection regression

# EVL-08. Runs the evaluation command on the relabelled probe set for every
# pull request and posts the figures with the change from the main branch.
#
# This job does NOT fail the build. It becomes blocking in EVL-21 (M2), on
# the development regression set, with these thresholds:
#   - more than 2 points overall
#   - more than 5 points in any attack type
#   - more than 1 point rise in benign block rate
#
# Until then it is a report, so a reviewer can see what a change did to
# detection without the job gating merges on a 240-sample development set.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  regression:
    name: Evaluate the probe set
    runs-on: ubuntu-latest
    continue-on-error: true      # EVL-08: report only. EVL-21 removes this.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Validate the sample set
        run: |
          python -m cosmac eval check \
            --set docs/cosmac/evidence/probe_set_v1.jsonl

      - name: Evaluate this branch
        run: |
          python -m cosmac eval run \
            --set docs/cosmac/evidence/probe_set_v1.jsonl \
            --out eval-head

      - name: Evaluate the merge base
        run: |
          git worktree add ../base "$(git merge-base HEAD origin/${{ github.base_ref }})"
          pip install -e ../base
          python -m cosmac eval run \
            --set docs/cosmac/evidence/probe_set_v1.jsonl \
            --out eval-base || echo "base evaluation failed; reporting head only"
          pip install -e .

      - name: Compare
        id: compare
        run: |
          python tools/compare_eval.py \
            --base eval-base/results.json \
            --head eval-head/results.json \
            --out comparison.md
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comparison.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- cosmac-regression -->'));
            const payload = '<!-- cosmac-regression -->\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: payload,
              });
            }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            eval-head/
            eval-base/
            comparison.md
