# Smithery.ai registry manifest for the cosmac MCP server.
# https://smithery.ai/ — hosted MCP registry with search + install UIs.

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      config_path:
        type: string
        description: >-
          Optional path to a custom cosmac YAML config. If omitted,
          the bundled interactive-assistant profile is used
          (src/cosmac/mcp_server/mcp_profile.yaml).
      data_dir:
        type: string
        description: >-
          Optional override for the cosmac data directory
          (default: ~/.cosmac/). Set this if the default home
          directory is read-only.
    required: []
  commandFunction: |-
    (config) => ({
      command: "cosmac-mcp",
      env: {
        ...(config.config_path ? { COSMAC_CONFIG: config.config_path } : {}),
        ...(config.data_dir ? { COSMAC_DATA_DIR: config.data_dir } : {}),
      },
    })
